name: Dependency audit

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high and above)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate on what ships: dev-only toolchain advisories (vitest/tinypool)
      # have no safe fix short of a breaking downgrade, so they would
      # red-light every week. The full tree still runs advisory below.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full tree (advisory, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
