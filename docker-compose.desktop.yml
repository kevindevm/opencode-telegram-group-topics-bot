# Docker Desktop override: use with
#   docker compose -f docker-compose.yml -f docker-compose.desktop.yml up -d --build
# The Desktop VM cannot use host networking, so reach OpenCode on the host
# through host.docker.internal instead.
services:
  opencode-group-topics-bot:
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENCODE_API_URL: http://host.docker.internal:4096
      OPENCODE_TELEGRAM_CONTAINER: "1"
